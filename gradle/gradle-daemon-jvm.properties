# Pins the Gradle daemon to the same JDK the mod targets.
#
# Gradle 8.14 supports running on Java 24 at most (Java 25 requires Gradle 9.1+). Left unpinned the
# daemon inherits JAVA_HOME, and on a JDK 25 machine that silently lands on an unsupported combo:
# the Groovy 3 build-script compiler cannot read major-version-69 class files, so any build script
# that resolves a class hierarchy reaching JDK classes dies with "Unsupported class file major
# version 69".
#
# Regenerate with: ./gradlew updateDaemonJvm --jvm-version=21
toolchainVersion=21
