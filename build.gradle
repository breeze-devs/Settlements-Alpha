import dev.breezes.gradle.EnsureJarManifest

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
    id 'me.champeau.jmh' version '0.7.3'
}

// Repairs jarJar'd artifacts that ship without a MANIFEST.MF, which ModDevGradle 1.0.21 NPEs on --
// see EnsureJarManifest in buildSrc for the upstream bug and why the class cannot live here.
// Producer jars are tagged `false` and the configuration requests `true`, which is what makes
// Gradle route them through the transform.
def jarManifestRepaired = Attribute.of('dev.breezes.jarManifestRepaired', Boolean)

dependencies {
    attributesSchema {
        attribute(jarManifestRepaired)
    }
    artifactTypes.getByName(ArtifactTypeDefinition.JAR_TYPE) {
        attributes.attribute(jarManifestRepaired, false)
    }
    registerTransform(EnsureJarManifest) {
        from.attribute(jarManifestRepaired, false)
                .attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, ArtifactTypeDefinition.JAR_TYPE)
        to.attribute(jarManifestRepaired, true)
                .attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, ArtifactTypeDefinition.JAR_TYPE)
    }
}

configurations.named('jarJar') {
    attributes {
        attribute(jarManifestRepaired, true)
    }
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // Might be useful: https://docs.neoforged.net/neogradle/docs/dependencies/nonmclibs/
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Nullability defaults are editor metadata, so the annotation library is compile-only.
    compileOnly 'org.checkerframework:checker-qual:4.2.3'

    // Dagger 2
    jarJar(implementation('com.google.dagger:dagger:2.60.1')) {
        version {
            prefer '2.60.1'
        }
    }

    // Both inject jars below are runtime-mandatory, and NOT merely because the sources are annotated.
    // dagger.internal.Provider -- the supertype of every generated factory -- is declared
    // `extends javax.inject.Provider<T>, jakarta.inject.Provider<T>`, so both packages must resolve
    // to link that interface. Dropping either is a NoClassDefFoundError at class-load time, not the
    // silent no-op that a merely-absent annotation package would be.
    jarJar(implementation('jakarta.inject:jakarta.inject-api:2.0.1')) {
        version {
            prefer '2.0.1'
        }
    }
    // Shipped under its canonical coordinate so NeoForge JarJar dedups it against the copy embedded
    // by any other mod
    jarJar(implementation('javax.inject:javax.inject:1')) {
        version {
            prefer '1'
        }
    }
    // jspecify annotations decorate Dagger 2.60.1's class files; needed to compile against them, not shipped.
    compileOnly 'org.jspecify:jspecify:1.0.0'

    // Dagger runtime must be explicitly on the dev runtime classpath (required for MC < 1.21.9)
    additionalRuntimeClasspath 'com.google.dagger:dagger:2.60.1'
    additionalRuntimeClasspath 'jakarta.inject:jakarta.inject-api:2.0.1'
    additionalRuntimeClasspath 'javax.inject:javax.inject:1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.60.1'
    testAnnotationProcessor 'com.google.dagger:dagger-compiler:2.60.1'

    testImplementation sourceSets.main.output
    testImplementation files(sourceSets.main.compileClasspath)

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Micro-benchmarks in src/jmh run only through `gradlew jmh`; nothing else depends on that source set.
//
// The plugin hangs the jmh classpaths off main's and test's, which ModDevGradle fills with Minecraft
// and the whole NeoForge library set; jmhJar would unpack all of it into one fat jar, and `jmh` would
// compile the tests. The benchmarks need only the mod's classes and the host's logging stack, so the
// classpaths are cut back to the jmh configurations. The logging stack declares no versions: it
// resolves to whatever NeoForge pins for the game, through the consistent-resolution link.
configurations {
    jmhCompileClasspath.setExtendsFrom([jmhImplementation, jmhCompileOnly])
    jmhRuntimeClasspath.setExtendsFrom([jmhImplementation, jmhRuntimeOnly])
    jmhCompileClasspath.shouldResolveConsistentlyWith(runtimeClasspath)
    jmhRuntimeClasspath.shouldResolveConsistentlyWith(runtimeClasspath)
}

dependencies {
    jmhCompileOnly 'org.apache.logging.log4j:log4j-api'
    jmhRuntimeOnly 'org.apache.logging.log4j:log4j-core'
    jmhRuntimeOnly 'net.minecrell:terminalconsoleappender'
    jmhRuntimeOnly 'com.mojang:logging'
}

// Each -P property overrides the benchmark classes' own annotation defaults for one run, e.g.
// `gradlew jmh -PjmhIncludes="debug2Args$|info2Args$" -PjmhForks=1`. jmhIncludes is one regex,
// because the plugin hands JMH every include as a single comma-joined pattern. A profiler that
// writes files does so in the project directory unless told otherwise, e.g. `jfr:dir=build/jmh-jfr`.
jmh {
    jmhVersion = '1.37'
    includeTests = false
    failOnError = true
    resultFormat = 'JSON'
    humanOutputFile = layout.buildDirectory.file('results/jmh/human.txt')
    profilers = providers.gradleProperty('jmhProfilers').map { it.tokenize(',') }.orElse(['gc'])
    includes = providers.gradleProperty('jmhIncludes').map { [it] }.orElse([])
    fork = providers.gradleProperty('jmhForks').map { it as Integer }
    warmupIterations = providers.gradleProperty('jmhWarmupIterations').map { it as Integer }
    warmup = providers.gradleProperty('jmhWarmupTime')
    iterations = providers.gradleProperty('jmhIterations').map { it as Integer }
    timeOnIteration = providers.gradleProperty('jmhIterationTime')
}

// The benchmark jar bundles the mod's classes and mods.toml. Kept out of build/libs, it cannot be
// copied into a mods folder beside the real jar, where NeoForge would reject the duplicate mod id.
// It does not run on its own either: merging the logging jars keeps only one of their Log4j plugin
// indexes, so it needs the original jars beside it on the classpath, as `gradlew jmh` provides.
tasks.named('jmhJar', Jar).configure {
    destinationDirectory = layout.buildDirectory.dir('jmh-libs')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
